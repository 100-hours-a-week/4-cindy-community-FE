namespace: default

deployment:
  name: community-board-fe

labels:
  app: community-board
  tier: frontend
  env: dev

replicaCount: 2

image:
  repository: 719905537984.dkr.ecr.ap-northeast-2.amazonaws.com/community-board-fe
  tag: v0.1.1
  pullPolicy: IfNotPresent

service:
  name: community-board-fe-svc
  type: ClusterIP
  port: 3000
  targetPort: http

container:
  name: fe
  portName: http
  port: 3000

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "250m"
    memory: "512Mi"

probes:
  readiness:
    path: /config.js
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /config.js
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

application:
  apiBaseUrl: "https://community-board.p-e.kr"
