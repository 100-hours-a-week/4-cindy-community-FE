<!doctype html>
<html lang="kr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/config.js"></script>
    <link
            rel="stylesheet"
            href="../css/index.css"
            crossorigin="anonymous"
    />
    <title>Cindy 디저트 커뮤니티</title>
</head>
<body>
<section class="wrap">
    <div class="write">
        <p class="eyebrow">Dessert Community 🍰</p>
        <h2>
            오늘 먹은 디저트를<br />
            소개해주세요!
        </h2>
        <p class="intro">
            케이크, 쿠키, 빵, 커피 페어링까지. 취향이 담긴 디저트 이야기를 모아보세요.
        </p>
        <div class="searchRow">
            <div class="searchBox">
                <input
                    id="searchInput"
                    class="searchInput"
                    type="text"
                    placeholder="검색어를 입력해주세요"
                    aria-label="게시글 검색"
                    minlength="2"
                />
                <button
                    class="searchButton"
                    type="button"
                    aria-label="검색"
                >
                    <svg
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        aria-hidden="true"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="7"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        />
                        <line
                            x1="16.65"
                            y1="16.65"
                            x2="21"
                            y2="21"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />
                    </svg>
                </button>
            </div>
            <a href="./board-write.html" id="writeLink">게시글 작성</a>
        </div>
        <div class="sortRow isHidden" id="searchSortRow" aria-hidden="true">
            <div class="sortBox">
                <svg
                    class="sortIcon"
                    viewBox="0 0 24 24"
                    width="16"
                    height="16"
                    aria-hidden="true"
                >
                    <path
                        d="M3 5h18l-7 8v5l-4 2v-7L3 5z"
                        fill="currentColor"
                    />
                </svg>
                <span class="sortLabel">정렬</span>
                <select id="searchSortSelect" class="sortSelect" aria-label="검색 정렬">
                    <option value="recent">최신순</option>
                    <option value="relevance">정확도순</option>
                </select>
            </div>
        </div>
    </div>
    <section
        class="trendingSection"
        aria-roledescription="carousel"
        aria-label="인기글"
    >
        <div class="trendingHeader">
            <div class="trendingTitleWrap">
                <h2>🔥 인기글</h2>
                <p id="trendingPeriod" class="trendingPeriod"></p>
            </div>
            <div class="trendingControls" aria-label="인기글 넘기기">
                <button
                    class="trendingControlButton"
                    id="trendingPrevButton"
                    type="button"
                    aria-label="이전 인기글"
                >
                    ‹
                </button>
                <button
                    class="trendingControlButton"
                    id="trendingNextButton"
                    type="button"
                    aria-label="다음 인기글"
                >
                    ›
                </button>
            </div>
        </div>
        <section class="trendingList"></section>
    </section>
    <section class="boardList"></section>
</section>
<div class="background"></div>
</body>
<script src="../js/index.js" type="module"></script>
</html>
